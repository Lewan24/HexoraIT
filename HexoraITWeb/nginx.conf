# Keep the scheme chain aligned with X-Forwarded-For. The API validates both
# proxy addresses and consumes these headers from right to left (two hops).
map $http_x_forwarded_proto $api_forwarded_proto {
    default $scheme;
    http "http, $scheme";
    https "https, $scheme";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Match the API's largest upload request limit (including multipart data).
    client_max_body_size 100000000;

    # Docker DNS, resolved per request so API recreation does not leave a stale
    # upstream address and standalone mock mode does not require an API service.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/api(?:/|$) {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $api_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' https: http:; frame-src blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /env.js {
        expires -1;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
