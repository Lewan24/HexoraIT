services:

  # OPTIONAL // depends if you have already postgres and want just another DB
  db:
    image: postgres:17

    profiles: # remove if you want to import it to like portainer and run everything
      - database

    container_name: postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: HexoraITApp
      POSTGRES_USER: HexoraIT
      POSTGRES_PASSWORD: ${HEXORAIT_DB_PASSWORD:?Set HEXORAIT_DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      
  # Just ui to check the postgresql its fully optional if you have already client or another app to check out dbs
  adminer:
    image: adminer

    profiles: # remove if you want to import it to like portainer and run everything
      - database

    container_name: adminer

    restart: unless-stopped

    ports:
      - "8082:8080"

    depends_on:
      - db

  api:
    image: lewan24/hexorait-api:latest
    container_name: hexoraitapi

    restart: unless-stopped

    ports:
      - "8081:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      ConnectionStrings__Default: >
        Host=db;
        Port=5432;
        Database=HexoraITApp;
        Username=HexoraIT;
        Password=${HEXORAIT_DB_PASSWORD:?Set HEXORAIT_DB_PASSWORD}
        
      Jwt__Issuer: HexoraITApp
      Jwt__Audience: HexoraITApp.Client
      # Provide at least 32 bytes of cryptographically random secret material.
      Jwt__SigningKey: ${HEXORAIT_JWT_SIGNING_KEY:?Set HEXORAIT_JWT_SIGNING_KEY}

      # you can create a volume and bind to it to store documents somewhere like on another server or something
      FileStorage__RootPath: /app/storage
      FileStorage__DataProtectionKeysPath: /app/data-protection-keys

      # Optional bootstrap. The password is required only when this email is set
      # and the account does not exist yet; remove it after the first startup.
      AppSettings__HexoraITAdmin: ${HEXORAIT_ADMIN_EMAIL:-}
      AppSettings__InitialAdminPassword: ${HEXORAIT_INITIAL_ADMIN_PASSWORD:-}
      AppSettings__AllowRegister: false
      # Make sure there is provided your domain (frontend) url, this is required for CORS settings and security
      AppSettings__AllowOrigins__0: "http://localhost:80"
      AppSettings__AllowOrigins__1: "http://localhost"
      # If the API is placed behind a reverse proxy, list its exact IP addresses.
      # Forwarded headers from every other source are ignored.
      # ReverseProxy__KnownProxies__0: "10.0.0.10"
      
    volumes:
      - hexorait-storage:/app/storage
      - hexorait-dataprotectionkeys-storage:/app/data-protection-keys

  frontend:
    image: lewan24/hexorait-web:latest
    container_name: hexoraitweb

    restart: unless-stopped

    ports:
      - "80:80"

    environment:
      # API url, the target domain where the ITDocs will be available at
      HEXORAIT_API_BASE_URL: http://localhost:8081/api
      HEXORAIT_APP_MODE: ${HEXORAIT_APP_MODE:-http}

    depends_on:
      - api

volumes:
  postgres-data:
  hexorait-storage:
  hexorait-dataprotectionkeys-storage:
