services:
  db:
    image: postgres:17
    container_name: postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: HexoraITApp
      POSTGRES_USER: HexoraIT
      POSTGRES_PASSWORD: HexoraIT

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: adminer

    restart: unless-stopped

    ports:
      - "8082:8080"

    depends_on:
      - db

volumes:
  postgres-data:
