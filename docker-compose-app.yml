services:
  api:
    image: lewan24/hexorait-api:latest
    build: ./HexoraITApi/HexoraIT.Api
    container_name: hexoraitapi

    restart: unless-stopped

    expose:
      - "8080"

    networks:
      default:
      backend:
        ipv4_address: ${HEXORAIT_API_IP:-172.30.50.2}
      hexorait_app:
        ipv4_address: 172.40.0.20

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__Default: >
        Host=db;
        Port=5432;
        Database=HexoraITApp;
        Username=HexoraIT;
        Password=${HEXORAIT_DB_PASSWORD:?Set HEXORAIT_DB_PASSWORD}
        
      Jwt__Issuer: HexoraITApp
      Jwt__Audience: HexoraITApp.Client
      # Provide at least 32 bytes of cryptographically random secret material.
      Jwt__SigningKey: ${HEXORAIT_JWT_SIGNING_KEY:?Set HEXORAIT_JWT_SIGNING_KEY}

      # you can create a volume and bind to it to store documents somewhere like on another server or something
      FileStorage__RootPath: /app/storage
      FileStorage__DataProtectionKeysPath: /app/data-protection-keys

      # Optional bootstrap. The password is required only when this email is set
      # and the account does not exist yet; remove it after the first startup.
      AppSettings__HexoraITAdmin: ${HEXORAIT_ADMIN_EMAIL:-}
      AppSettings__InitialAdminPassword: ${HEXORAIT_INITIAL_ADMIN_PASSWORD:-}
      AppSettings__AllowRegister: false
      # Public browser origin, including https:// and no trailing slash or /api.
      AppSettings__AllowOrigins__0: ${HEXORAIT_PUBLIC_ORIGIN:?Set HEXORAIT_PUBLIC_ORIGIN}
      AppSettings__PublicUrl: ${HEXORAIT_PUBLIC_ORIGIN:?Set HEXORAIT_PUBLIC_ORIGIN}
      # Trust the frontend hop and the exact NPM source IP seen by the frontend.
      ReverseProxy__KnownProxies__0: ${HEXORAIT_FRONTEND_IP:-172.40.0.21}
      # ReverseProxy__KnownProxies__1: ${HEXORAIT_NPM_IP:?Set HEXORAIT_NPM_IP}
      ReverseProxy__ForwardLimit: 2
      
    volumes:
      - hexorait-storage:/app/storage
      - hexorait-dataprotectionkeys-storage:/app/data-protection-keys

  frontend:
    image: lewan24/hexorait-web:latest
    build: ./HexoraITWeb
    container_name: hexoraitweb

    restart: unless-stopped

    ports:
      - "${HEXORAIT_FRONTEND_BIND_IP:-127.0.0.1}:${HEXORAIT_FRONTEND_PORT:-8080}:80"

    networks:
      backend:
        ipv4_address: ${HEXORAIT_FRONTEND_IP:-172.30.50.3}
      hexorait_app:
        ipv4_address: 172.40.0.21

    environment:
      # The browser uses the same HTTPS origin; frontend Nginx forwards to api.
      HEXORAIT_API_BASE_URL: /api
      HEXORAIT_APP_MODE: ${HEXORAIT_APP_MODE:-http}

    depends_on:
      - api

networks:
  backend:
    ipam:
      config:
        - subnet: ${HEXORAIT_BACKEND_SUBNET:-172.30.50.0/29}
  hexorait_app:
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.0.0/24

volumes:
  hexorait-storage:
  hexorait-dataprotectionkeys-storage:
